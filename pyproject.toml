[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-app"
version = "0.1.0"
description = "Phase-1 RAG pipeline as a FastAPI service"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["rag_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
